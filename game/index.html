<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZENITH — Open-World Crime</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1026; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #f2ede8; }
  canvas { display: block; }
  .hidden { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .hud-topleft { position: absolute; top: 14px; left: 16px; }
  #hud-money { font-size: 30px; font-weight: 800; color: #7dff8a; text-shadow: 0 2px 6px rgba(0,0,0,.8); letter-spacing: 1px; }
  .hud-healthwrap { width: 190px; height: 12px; margin-top: 6px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; overflow: hidden; }
  #hud-health { height: 100%; width: 100%; background: #3aa655; transition: width .2s; }
  #hud-ammo { margin-top: 6px; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 4px #000; }
  .hud-topright { position: absolute; top: 14px; right: 16px; text-align: right; }
  #hud-stars { font-size: 30px; letter-spacing: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
  #hud-radio { margin-top: 4px; font-size: 13px; color: #ffd24a; text-shadow: 0 1px 4px #000; }
  #hud-banner { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); text-align: center; }
  .hud-banner-title { font-size: 40px; font-weight: 900; letter-spacing: 4px; color: #ffd24a; text-shadow: 0 3px 12px rgba(0,0,0,.9); }
  .hud-banner-sub { font-size: 16px; margin-top: 4px; text-shadow: 0 2px 6px #000; }
  #hud-objective { position: absolute; top: 100px; left: 16px; max-width: 420px; font-size: 14px; line-height: 1.4; background: rgba(0,0,0,.45); padding: 8px 10px; border-left: 3px solid #ffd24a; border-radius: 4px; }
  #hud-distance { position: absolute; top: 168px; left: 16px; font-size: 14px; font-weight: 700; color: #ffd24a; text-shadow: 0 1px 4px #000; }
  #hud-toast { position: absolute; bottom: 210px; left: 50%; transform: translateX(-50%); font-size: 16px; background: rgba(0,0,0,.6); padding: 8px 16px; border-radius: 20px; white-space: nowrap; }
  #hud-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 700; color: rgba(255,255,255,.9); text-shadow: 0 0 6px #000; }
  #hud-vignette { position: absolute; inset: 0; box-shadow: inset 0 0 120px 40px rgba(200,0,0,.55); }
  #hud-minimap { position: absolute; left: 16px; bottom: 16px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.6); }

  #menu, #pause, #busted { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(26,10,40,.55), rgba(10,4,18,.82)); }
  .menu-inner { text-align: center; max-width: 640px; padding: 32px; }
  .menu-title { font-size: 84px; font-weight: 900; letter-spacing: 14px; color: #ffd24a; text-shadow: 0 0 34px rgba(255,126,61,.85), 0 4px 0 #7a2d12; }
  .menu-tag { font-size: 17px; margin-top: 10px; color: #f2ede8; line-height: 1.5; }
  .menu-controls { margin-top: 22px; font-size: 14px; line-height: 1.9; color: #cfc6de; }
  .menu-missions { margin-top: 14px; font-size: 14px; color: #9fd8ff; }
  #menu-start, #pause-resume, #pause-quit, #busted-ok { pointer-events: auto; margin-top: 26px; padding: 14px 42px; font-size: 19px; font-weight: 800; letter-spacing: 3px; color: #1a1026; background: #ffd24a; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #a67c00; }
  #menu-start:hover, #pause-resume:hover, #pause-quit:hover, #busted-ok:hover { background: #ffe27a; }
  #pause-quit { background: #cfc6de; box-shadow: 0 4px 0 #6a6378; margin-left: 12px; }
  .menu-note { margin-top: 18px; font-size: 12px; color: #8d84a5; }
  #selftest { position: fixed; left: 10px; top: 10px; z-index: 20; background: rgba(0,0,0,.8); color: #7dff8a; font: 13px/1.5 monospace; padding: 10px; white-space: pre; max-width: 620px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<script type="module" src="src/main.js"></script>
</body>
</html>
